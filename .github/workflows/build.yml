name: gokong build
on:
  push:
    branches:
      - develop
      - stage
      - master
      - feature/*

jobs:
  build:
    name: building gokong
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v4
      with:
        go-version: '1.23' # The Go version to download (if necessary) and use.
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.11.4'  # The Terraform version to download (if necessary) and use.
    - run: go version

    - name: Build
      run: make build

    - name: Run test
      run: make test

